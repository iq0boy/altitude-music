# Récupère chaque matin les derniers posts Instagram du studio (script
# scripts/sync-instagram.mjs) et pousse sur main s'il y a du nouveau → Netlify
# redéploie. Secrets GitHub : INSTAGRAM_TOKEN (obligatoire) ; GH_PAT (optionnel,
# jeton GitHub avec droit « secrets » sur le dépôt) pour renouveler
# INSTAGRAM_TOKEN automatiquement chaque lundi — sinon il expire après 60 jours.
name: Sync Instagram

on:
  schedule:
    - cron: '0 5 * * *'   # tous les jours 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest posts
        run: node scripts/sync-instagram.mjs

      - name: Commit and push if changed
        run: |
          git add -A src/data/instagram.json src/assets/instagram
          if git diff --cached --quiet; then
            echo "Instagram inchangé, rien à pousser."
            exit 0
          fi
          git config user.name "altitude-bot"
          git config user.email "altitudemusic13@gmail.com"
          git commit -m "chore(instagram): nouveaux posts"
          git push

      - name: Refresh the Instagram token (Mondays, needs GH_PAT)
        if: ${{ env.GH_PAT != '' && env.INSTAGRAM_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.GH_PAT }}
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Pas lundi : pas de renouvellement."; exit 0
          fi
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${INSTAGRAM_TOKEN}" | jq -r '.access_token // empty')
          if [ -z "$NEW" ]; then echo "::warning::Renouvellement du jeton Instagram échoué"; exit 0; fi
          gh secret set INSTAGRAM_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Jeton Instagram renouvelé (60 jours)."
